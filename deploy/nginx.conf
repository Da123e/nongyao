# 金生链 · Nginx 配置
# 部署位置：/etc/nginx/sites-available/nongyao
# 无域名也能用：server_name _; 会匹配所有访问方式（含直接用公网 IP）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    # ---------- 前端静态文件 ----------
    root /var/www/nongyao/dist;
    index index.html;

    # ---------- 后端 API + WebSocket ----------
    # 关键：Upgrade / Connection 两行是 WebSocket 实时推送的命脉。
    # 删掉它们页面不报错，但传感器数据不会实时刷新，只能靠轮询。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- React 前端路由 ----------
    # 没有这段，访问 /sales 后按 F5 刷新会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存一周
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
